# Plik do zaimportowania w CasaOS: App Store -> „+” -> Custom Install -> Import.
# Dwa kontenery: aplikacja oraz Watchtower, który codziennie o 2:00 instaluje nowe wersje z GitHuba.
name: stany-sklepow
services:
  stany-sklepow:
    image: ghcr.io/mdziura123-cmd/stany-sklepow:latest
    container_name: stany-sklepow
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Europe/Warsaw
      RUN_HOURS: "8,17,23" # godziny pobierania (można zmienić w panelu)
      UPDATE_HOUR: "2"     # tylko informacyjnie – godzina aktualizacji z Watchtowera
      BACKUP_DIR: /backups # bez tego kopie trafiają do /data/backups
    volumes:
      - /DATA/AppData/stany-sklepow:/data
      - /DATA/Backup/stany-sklepow:/backups
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    x-casaos:
      envs:
        - container: RUN_HOURS
          description:
            en_us: Download hours
            pl_pl: Godziny pobierania
      ports:
        - container: "8090"
          description:
            en_us: Web panel
            pl_pl: Panel WWW
      volumes:
        - container: /data
          description:
            en_us: Database
            pl_pl: Baza danych
        - container: /backups
          description:
            en_us: Daily database backups
            pl_pl: Codzienne kopie zapasowe bazy

  watchtower:
    # utrzymywana wersja Watchtowera (oryginał containrrr/watchtower jest porzucony)
    image: nickfedor/watchtower:latest
    container_name: stany-sklepow-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["stany-sklepow"]               # aktualizuje tylko kontener tej aplikacji
    environment:
      TZ: Europe/Warsaw
      WATCHTOWER_SCHEDULE: "0 0 2 * * *"     # codziennie o 2:00 (przed pobieraniem o 3:00)
      WATCHTOWER_CLEANUP: "true"             # usuwa stare obrazy
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_UPDATE_ON_START: "true"     # sprawdza też od razu po uruchomieniu (np. po restarcie serwera)

x-casaos:
  architectures: [amd64, arm64]
  main: stany-sklepow
  category: Utilities
  author: mdziura123-cmd
  developer: mdziura123-cmd
  icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/grocy.png
  tagline:
    en_us: Track shop stock levels, sales and deliveries
    pl_pl: Śledzenie stanów sklepów, sprzedaży i dostaw
  description:
    en_us: Downloads stock levels from shop websites daily and shows best sellers, categories, deliveries and alerts.
    pl_pl: Codziennie pobiera stany ze stron sklepów i pokazuje bestsellery, kategorie, dostawy i alerty.
  title:
    en_us: Stany sklepów
    pl_pl: Stany sklepów
  port_map: "8090"
  scheme: http
  index: /
